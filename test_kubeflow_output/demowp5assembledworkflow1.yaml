          \  python3 -m pip install --quiet --no-warn-script-location 'numpy' 'pandas'\
          \ 'scikit-learn' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef task_component():\n    \"\"\"Generated component for task execution\"\
          \"\"\n    import os\n    import pickle\n    import json\n\n    # Create\
          \ necessary directories\n    os.makedirs(\"/tmp/inputs\", exist_ok=True)\n\
          \    os.makedirs(\"/tmp/outputs\", exist_ok=True)\n\n    # Execute the adapted\
          \ task script\n    # Create a globals dict with the task script context\n\
          \    script_globals = {\n        \"__name__\": \"__main__\",\n        \"\
          os\": os,\n        \"pickle\": pickle,\n        \"json\": json\n    }\n\n\
          \    # Execute the task script\n    exec(task_script, script_globals)\n\n"
        image: python:3.8-slim
